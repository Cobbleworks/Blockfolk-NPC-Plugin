name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: >-
          mvn versions:set
          -DnewVersion="${{ steps.version.outputs.value }}"
          -DgenerateBackupPoms=false
          -B
          --no-transfer-progress

      - name: Build and test with Maven
        run: mvn clean verify -B --no-transfer-progress

      - name: Verify release artifact
        run: test -f target/Blockfolk.jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          args=(
            release create "$GITHUB_REF_NAME"
            target/Blockfolk.jar
            --verify-tag
            --generate-notes
            --title "${{ github.event.repository.name }} $GITHUB_REF_NAME"
          )

          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh "${args[@]}"
