name: Blockfolk
version: ${project.version}
main: dev.blockfolk.BlockfolkPlugin
api-version: '1.21.11'
author: Blockfolk
commands:
  blockfolk:
    aliases: [bf]
    description: Opens and controls Blockfolk.
    usage: /bf [create [name]|routes|npc <name>]
    permission: blockfolk.admin
permissions:
  blockfolk.admin:
    description: Allows creating, editing, and spawning Blockfolk NPCs.
    default: op
