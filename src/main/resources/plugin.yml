name: EasyNPC
version: ${project.version}
main: dev.easynpc.EasyNpcPlugin
api-version: '1.21.11'
author: EasyNPC
commands:
  eznpc:
    description: Opens and controls EasyNPC.
    usage: /eznpc [create <name>|<name> spawn]
    permission: eznpc.admin
permissions:
  eznpc.admin:
    description: Allows creating, editing, and spawning EasyNPC NPCs.
    default: op
