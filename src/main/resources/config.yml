chat-input-timeout-seconds: 60
# How long a player has to answer an NPC question before its Cancel/Timeout branch runs.
question-timeout-seconds: 30
# Prevent rapid On Player Approach/Leaves transitions while an NPC starts or stops moving.
proximity-transition-cooldown-seconds: 3
# Optional. External image URLs work without a key at MineSkin's public rate limit.
mineskin-api-key: ""

# Optional AI behaviour. Configure this per NPC preset in its dedicated
# AI Behaviour menu. No requests are made for paused presets.
openrouter:
  # HTTPS is required so the API key is never sent over plaintext HTTP.
  endpoint: "https://openrouter.ai/api/v1/chat/completions"
  api-key: ""
  model: "deepseek/deepseek-v4-flash-0731"
  # Increase this further for slower providers or reasoning-heavy models.
  timeout-seconds: 12
  # Output allowance for the final JSON decision. Reasoning is disabled for lower latency.
  max-tokens: 1600
ai-control:
  # Per-NPC protection in addition to trigger-specific event throttling.
  invocation-cooldown-seconds: 2
  # Recent conversation lines supplied to the model per NPC conversation. Set to 0 to disable history.
  conversation-history-limit: 20
