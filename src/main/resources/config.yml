chat-input-timeout-seconds: 60
# How long a player has to answer an NPC question before its Cancel/Timeout branch runs.
question-timeout-seconds: 30
# Prevent rapid On Player Approach/Leaves transitions while an NPC starts or stops moving.
proximity-transition-cooldown-seconds: 3
# Optional. External image URLs work without a key at MineSkin's public rate limit.
mineskin-api-key: ""
# NPCs with "Keep Chunks Loaded" (NPC Properties) hold the chunks around them loaded as they walk.
chunk-loading:
  # Chunks loaded in every direction around such an NPC: 0 = only its own chunk, 1 = 3x3, 2 = 5x5, 3 = 7x7.
  radius: 1
# Damaged NPCs show a small [■■■■□□□□□□] health bar above their head until they are back to full health.
health-bars:
  enabled: true
  # Blocks within which players see the bar.
  view-distance: 16

# Optional AI behaviour. Configure this per NPC preset in its dedicated
# AI Behaviour menu. No requests are made for paused presets.
openrouter:
  # HTTPS is required so the API key is never sent over plaintext HTTP.
  endpoint: "https://openrouter.ai/api/v1/chat/completions"
  api-key: ""
  model: "deepseek/deepseek-v4-flash-0731"
  # Increase this further for slower providers or reasoning-heavy models.
  timeout-seconds: 17
  # Output allowance for action tool calls and memory JSON, including any reasoning tokens.
  max-tokens: 1600
  # How much the model may think before acting: none, minimal, low, medium, or high.
  # A little reasoning makes NPCs follow through on requested actions far more reliably;
  # use "none" for the lowest latency. Models without reasoning support ignore this.
  reasoning-effort: "low"
ai-control:
  # Per-NPC protection in addition to trigger-specific event throttling.
  invocation-cooldown-seconds: 2
  # Recent conversation lines supplied to the model per NPC conversation. Set to 0 to disable history.
  conversation-history-limit: 20
  # NPC-to-NPC conversations. NPCs with "Respond to NPCs" enabled answer what nearby NPCs say (also an NPC's reply to a player),
  # including scripted Send Dialog lines. Holo Dialog (flavour text) is ignored.
  npc-conversations:
    # Response rounds one conversation may trigger before it ends. Set to 0 to turn NPC replies off.
    max-replies: 6
    # Hard time limit for one conversation.
    max-duration-seconds: 120
    # After a conversation ends, the same NPCs wait this long before talking again. Also limits how
    # often "On Nearby NPC" fires for the same pair.
    cooldown-seconds: 120
    # Pause after a line before listeners answer, so players can read it.
    reply-delay-seconds: 2
    # Blocks within which other NPCs hear a spoken line.
    hearing-range: 12
    # NPC conversations and "On Nearby NPC" only run while a player is within this many blocks.
    player-range: 32
